<!doctype html>
<html lang="en">
  <head>
    <script>
      const host = window.location.hostname;
      if (host === 'laksham-ride.web.app' || host === 'laksham-ride.firebaseapp.com') {
        const path = window.location.pathname;
        if (path.startsWith('/admin')) {
          window.location.replace('https://admin.rideclub.in' + path.replace(/^(\/admin)/, '') + window.location.search + window.location.hash);
        } else {
          window.location.replace('https://app.rideclub.in' + path + window.location.search + window.location.hash);
        }
      }
    </script>
    <meta charset="UTF-8" />
